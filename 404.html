<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08090c" />
  <title>404 — Omar AbuZeineh</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    .miss { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .miss h1 { font-size: clamp(3rem, 12vw, 6rem); margin-bottom: .5rem; }
    .miss p { color: var(--muted); margin-bottom: 1.25rem; }
  </style>
</head>
<body>
  <main class="miss">
    <div>
      <p class="kicker">404</p>
      <h1>Omar-i9</h1>
      <p data-error>This lab path does not exist.</p>
      <a class="btn btn-primary" href="./">Back to home</a>
    </div>
  </main>
  <script>
    const ar = (localStorage.getItem('omar_site_lang') || navigator.language || '').startsWith('ar')
      || localStorage.getItem('omar_site_lang') === 'ar';
    if (ar) {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      document.querySelector('[data-error]').textContent = 'المسار الذي طلبته غير موجود في المختبر.';
      document.querySelector('.btn').textContent = 'العودة للرئيسية';
    }
  </script>
</body>
</html>
