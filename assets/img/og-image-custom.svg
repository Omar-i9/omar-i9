      <stop offset="100%" stop-color="#061722"/>
    </linearGradient>
    <radialGradient id="cyanGlow"><stop offset="0%" stop-color="#00eaff" stop-opacity=".22"/><stop offset="100%" stop-color="#00eaff" stop-opacity="0"/></radialGradient>
