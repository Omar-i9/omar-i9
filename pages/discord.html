<body class="discord-body">
  <article class="discord-card">
    <button class="discord-close" id="discordClose" type="button" aria-label="إغلاق"></button>
    <div class="discord-banner" aria-hidden="true"></div>
    <div class="discord-content">
      <img class="discord-avatar" src="../assets/img/profile.webp" alt="" width="76" height="76" />
      <h1 class="discord-name">Omar</h1>
      <p class="discord-handle" data-handle dir="ltr">gdmi_3</p>
      <button class="share-copy-btn" id="discordCopyBtn" type="button">
        <span data-i18n="discordCopy">نسخ المعرّف</span>
      </button>
    </div>
  </article>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="../scripts/pages/discord-page.js"></script>
