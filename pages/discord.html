<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Discord Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050711;
      --panel: rgba(10, 15, 29, .94);
      --line: rgba(255,255,255,.1);
      --text: #f8fbff;
      --muted: rgba(226,237,255,.66);
      --discord: #5865f2;
      --cyan: #22d3ee;
      --green: #22c55e;
      --ease: cubic-bezier(.22,.9,.22,1);
      --spring: cubic-bezier(.18,.95,.24,1.12);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 12px;
      font-family: Cairo, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 8%, rgba(88,101,242,.24), transparent 34%),
        radial-gradient(circle at 88% 78%, rgba(34,211,238,.14), transparent 32%),
        linear-gradient(145deg, #040711, #070a17 60%, #0a1021);
      overflow: hidden;
    }
    .card {
      position: relative;
      width: min(380px, 100%);
      max-height: min(560px, calc(100dvh - 24px));
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(165deg, rgba(12, 18, 35, .96), rgba(5, 8, 17, .98));
      border: 1px solid rgba(88,101,242,.28);
      box-shadow: 0 28px 80px rgba(0,0,0,.62), 0 0 40px rgba(88,101,242,.12);
      animation: popIn .46s var(--spring) both;
      display: flex;
      flex-direction: column;
    }
    .close {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      width: 36px;
      height: 36px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(0,0,0,.32);
      color: #fff;
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
    }
    .close:hover { transform: translateY(-2px) rotate(-4deg); background: rgba(88,101,242,.36); border-color: rgba(88,101,242,.45); }
    .banner {
      height: 112px;
      background: url('../assets/img/discord-dino-banner.svg') center/cover no-repeat;
      border-bottom: 1px solid rgba(255,255,255,.08);
      flex: 0 0 auto;
    }
    .content {
      position: relative;
      padding: 58px 16px 16px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .content::-webkit-scrollbar { width: 5px; }
    .content::-webkit-scrollbar-thumb { background: rgba(88,101,242,.45); border-radius: 999px; }
    .avatar {
      position: absolute;
      top: -44px;
      right: 18px;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(145deg, var(--discord), var(--cyan));
      box-shadow: 0 18px 36px rgba(0,0,0,.45), 0 0 24px rgba(88,101,242,.28);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #050711;
    }
    .dot {
      position: absolute;
      left: 6px;
      bottom: 8px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid #050711;
      box-shadow: 0 0 14px rgba(34,197,94,.54);
    }
    .head {
      display: grid;
      gap: 4px;
      padding-inline-end: 102px;
      min-height: 54px;
    }
    h1 { margin: 0; font-size: 1.32rem; line-height: 1.15; font-weight: 900; }
    .tag {
      direction: ltr;
      text-align: right;
      color: var(--muted);
      font-family: Rajdhani, Cairo, sans-serif;
      font-size: 1.04rem;
      font-weight: 700;
    }
    .mini {
      margin: 14px 0 0;
      display: grid;
      gap: 9px;
    }
    .row {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.075);
      direction: ltr;
      text-align: left;
    }
    .row i {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-style: normal;
      background: rgba(88,101,242,.18);
      border: 1px solid rgba(88,101,242,.28);
    }
    .row strong { display: block; font-size: .9rem; }
    .row span { display: block; margin-top: 2px; color: var(--muted); font-size: .72rem; }
    .copy {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      border: 1px solid rgba(34,211,238,.28);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(88,101,242,.22), rgba(34,211,238,.08));
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .22s var(--ease), filter .22s var(--ease), border-color .22s var(--ease);
    }
    .copy:hover { transform: translateY(-2px); filter: brightness(1.08); border-color: rgba(34,211,238,.5); }
    .copy::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      left: var(--x, 50%);
      top: var(--y, 50%);
    }
    .copy.rip::after { animation: ripple .55s ease-out; }
    .hint {
      margin: 10px 0 0;
      color: rgba(226,237,255,.54);
      font-size: .66rem;
      text-align: center;
      font-weight: 800;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) translateY(12px);
      opacity: 0;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(6, 13, 24, .96);
      border: 1px solid rgba(34,211,238,.22);
      color: #fff;
      font-size: .78rem;
      font-weight: 900;
      transition: opacity .22s var(--ease), transform .22s var(--ease);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @keyframes popIn { from { opacity: 0; transform: translateY(24px) scale(.96); filter: blur(6px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    @keyframes ripple { from { transform: translate(-50%, -50%) scale(0); opacity: .55; } to { transform: translate(-50%, -50%) scale(24); opacity: 0; } }
    @media (max-width: 390px) {
      body { padding: 9px; }
      .card { max-height: calc(100dvh - 18px); border-radius: 22px; }
      .banner { height: 104px; }
      .content { padding: 52px 13px 13px; }
      .avatar { width: 78px; height: 78px; top: -40px; right: 14px; }
      .head { padding-inline-end: 92px; }
      h1 { font-size: 1.18rem; }
      .tag { font-size: .94rem; }
    }
  </style>
</head>
<body>
  <article class="card" role="dialog" aria-label="بطاقة ديسكورد">
    <button class="close" id="closeBtn" type="button" aria-label="إغلاق">×</button>
    <div class="banner" aria-hidden="true"></div>
    <div class="content">
      <div class="avatar">
        <img src="../assets/img/profile.webp" alt="Omar profile image" />
        <span class="dot" aria-hidden="true"></span>
      </div>
      <header class="head">
        <h1>Omar | عُـمَر</h1>
        <div class="tag">@gdmi_3</div>
      </header>
      <section class="mini" aria-label="معلومات مختصرة">
        <div class="row"><i>🎮</i><div><strong>Discord Username</strong><span>gdmi_3</span></div></div>
        <div class="row"><i>⚡</i><div><strong>Status</strong><span>Gaming / Coding / Projects</span></div></div>
      </section>
      <button class="copy" id="copyUser" type="button"><span>نسخ username</span></button>
      <p class="hint">اسحب داخل البطاقة للنزول والصعود</p>
    </div>
  </article>
  <div class="toast" id="toast">تم النسخ</div>
  <script>
    const toast = document.getElementById('toast');
    const btn = document.getElementById('copyUser');
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.remove('show'), 1300);
    }
    async function copyUser(event) {
      const rect = btn.getBoundingClientRect();
      btn.style.setProperty('--x', `${event.clientX - rect.left}px`);
      btn.style.setProperty('--y', `${event.clientY - rect.top}px`);
      btn.classList.remove('rip');
      void btn.offsetWidth;
      btn.classList.add('rip');
      try {
        await navigator.clipboard.writeText('gdmi_3');
        showToast('تم نسخ gdmi_3');
      } catch (_) {
        showToast('انسخها يدويًا: gdmi_3');
      }
    }
    btn.addEventListener('click', copyUser);
    document.getElementById('closeBtn').addEventListener('click', () => {
      parent.postMessage({ type: 'close-discord' }, '*');
    });
  </script>
</body>
</html>
